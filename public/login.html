<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinDash - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #14110c;
      color: #f2ebdd;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      background: #1f1a13;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(193, 122, 63, 0.15);
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #c17a3f, #dba86a);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
    }

    .brand-icon i {
      font-size: 1.5rem;
      color: #fff;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand p {
      font-size: 0.875rem;
      color: #a99c85;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #a99c85;
      margin-bottom: 0.375rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: #a99c85;
      font-size: 0.875rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 0.875rem 0.75rem 2.5rem;
      background: #14110c;
      border: 1px solid #2a2318;
      border-radius: 10px;
      color: #f2ebdd;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #c17a3f;
    }

    .form-group input::placeholder {
      color: #3a3020;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #d9704e;
      font-size: 0.8125rem;
      padding: 0.625rem 0.875rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      display: none;
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: #c17a3f;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #a8763a;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <svg viewBox="0 0 640 250" style="width:100%;max-width:280px;display:block;margin:0 auto 0.5rem;" role="img" aria-label="Crossover">
        <defs>
          <linearGradient id="cog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a066"/><stop offset="0.5" stop-color="#c17a3f"/><stop offset="1" stop-color="#8f5a2c"/></linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3020"/><stop offset="1" stop-color="#14110c"/></linearGradient>
          <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e0a53f" stop-opacity="0.28"/><stop offset="1" stop-color="#e0a53f" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse cx="440" cy="140" rx="230" ry="120" fill="url(#glow)"/>
        <ellipse cx="325" cy="214" rx="250" ry="14" fill="#000" opacity="0.4"/>
        <!-- body: tall crossover stance with fastback roofline -->
        <path fill="url(#cog)" d="M 38 182 L 52 150 Q 60 118 96 114 L 240 108 L 296 62 Q 312 54 344 56 L 402 60 Q 450 64 474 96 L 508 122 L 560 126 Q 588 130 596 152 L 602 182 L 548 182 A 52 52 0 0 0 444 182 L 212 182 A 52 52 0 0 0 108 182 Z"/>
        <!-- rising character line -->
        <path fill="#8f5a2c" opacity="0.5" d="M 112 150 L 470 138 L 598 148 L 598 156 L 470 146 L 112 158 Z"/>
        <!-- black lower cladding + wheel-arch trim (crossover cue) -->
        <path d="M 108 182 A 52 52 0 0 1 212 182" fill="none" stroke="#14110c" stroke-width="8"/>
        <path d="M 444 182 A 52 52 0 0 1 548 182" fill="none" stroke="#14110c" stroke-width="8"/>
        <path fill="#14110c" opacity="0.9" d="M 210 176 L 446 176 L 446 184 L 210 184 Z"/>
        <!-- compact raked greenhouse -->
        <path fill="url(#glass)" d="M 248 106 L 298 66 Q 312 58 342 60 L 398 64 Q 438 68 458 94 L 466 106 Z"/>
        <rect x="356" y="62" width="9" height="44" fill="#8f5a2c" opacity="0.85"/>
        <!-- L-shaped headlight -->
        <path fill="#e0a53f" d="M 46 148 L 74 138 L 76 147 L 52 156 Z" opacity="0.95"/>
        <!-- spear taillight -->
        <path fill="#d9704e" d="M 588 150 L 600 154 L 600 164 L 586 160 Z" opacity="0.9"/>
        <rect x="288" y="132" width="34" height="5" rx="2.5" fill="#2a2318" opacity="0.7"/>
        <!-- front wheel -->
        <circle cx="160" cy="182" r="48" fill="#14110c"/><circle cx="160" cy="182" r="48" fill="none" stroke="#2a2318" stroke-width="4"/><circle cx="160" cy="182" r="22" fill="#1f1a13" stroke="#c17a3f" stroke-width="2.5"/>
        <g stroke="#a8763a" stroke-width="3" stroke-linecap="round"><line x1="160" y1="162" x2="160" y2="202"/><line x1="140" y1="182" x2="180" y2="182"/><line x1="146" y1="168" x2="174" y2="196"/><line x1="146" y1="196" x2="174" y2="168"/></g>
        <!-- rear wheel -->
        <circle cx="496" cy="182" r="48" fill="#14110c"/><circle cx="496" cy="182" r="48" fill="none" stroke="#2a2318" stroke-width="4"/><circle cx="496" cy="182" r="22" fill="#1f1a13" stroke="#c17a3f" stroke-width="2.5"/>
        <g stroke="#a8763a" stroke-width="3" stroke-linecap="round"><line x1="496" y1="162" x2="496" y2="202"/><line x1="476" y1="182" x2="516" y2="182"/><line x1="482" y1="168" x2="510" y2="196"/><line x1="482" y1="196" x2="510" y2="168"/></g>
      </svg>
      <h1>FinDash</h1>
      <p>Sign in to your finances dashboard</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          errorMsg.textContent = data.error || 'Invalid credentials';
          errorMsg.style.display = 'block';
        }
      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
