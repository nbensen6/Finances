app = "nbensen-finances"
primary_region = "ord"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "finances_data"
  destination = "/data"

[env]
  NODE_ENV = "production"
